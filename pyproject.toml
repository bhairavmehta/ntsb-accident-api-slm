[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntsb-accident-api"
version = "1.0.0"
description = "REST API, CLI, MCP tools and interactive UI over NTSB aviation accident data (CAROL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "pydantic>=2.7",
                "pypdf>=4.0", "python-multipart>=0.0.9", "numpy>=1.26"]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
slm = ["llama-cpp-python>=0.3", "huggingface_hub>=0.23", "fastembed>=0.4"]
embeddings = ["fastembed>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ntsb = "ntsb_api.cli:main"

[tool.setuptools]
packages = ["ntsb_api"]

[tool.setuptools.package-data]
ntsb_api = ["data/*.json", "static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
